<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reconhecimento de Emoções - Face API</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 20px;
            margin-bottom: 20px;
        }

        .video-section {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .video-container {
            position: relative;
            width: 100%;
            border-radius: 15px;
            overflow: hidden;
            background: #000;
            aspect-ratio: 16/9;
        }

        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .controls {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            background: white;
            color: #667eea;
            min-width: 120px;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .ranking-section {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            color: white;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            max-height: 600px;
        }

        .ranking-section h2 {
            margin-bottom: 20px;
            text-align: center;
            font-size: 1.8em;
        }

        .ranking-container {
            flex: 1;
            overflow-y: auto;
            padding-right: 5px;
        }

        .ranking-container::-webkit-scrollbar {
            width: 8px;
        }

        .ranking-container::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }

        .ranking-container::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 4px;
        }

        .ranking-item {
            background: rgba(255, 255, 255, 0.2);
            margin-bottom: 10px;
            padding: 15px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: transform 0.2s;
        }

        .ranking-item:hover {
            transform: scale(1.02);
            background: rgba(255, 255, 255, 0.25);
        }

        .emoji {
            font-size: 30px;
            min-width: 50px;
            text-align: center;
        }

        .emotion-info {
            flex: 1;
        }

        .emotion-name {
            font-weight: 600;
            margin-bottom: 5px;
            text-transform: capitalize;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #ffd700, #ff8c00);
            border-radius: 4px;
            transition: width 0.3s ease;
        }

        .percentage {
            margin-left: 10px;
            font-weight: 600;
            min-width: 50px;
            text-align: right;
        }

        .count {
            background: #ffd700;
            color: #333;
            padding: 3px 10px;
            border-radius: 15px;
            font-size: 14px;
            font-weight: 600;
        }

        .status {
            text-align: center;
            color: white;
            margin-top: 20px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            font-weight: 500;
        }

        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100px;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .emotion-history {
            margin-top: 20px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            color: white;
        }

        .history-title {
            font-size: 1.2em;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .history-items {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            min-height: 40px;
        }

        .history-item {
            background: rgba(255, 255, 255, 0.2);
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .error-message {
            color: #ff6b6b;
            background: rgba(255, 255, 255, 0.1);
            padding: 10px;
            border-radius: 5px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎭 Reconhecimento de Emoções em Tempo Real</h1>
        
        <div class="main-content">
            <div class="video-section">
                <div class="video-container">
                    <video id="video" autoplay playsinline muted></video>
                    <canvas id="canvas"></canvas>
                </div>
                <div class="controls">
                    <button id="startBtn" onclick="startVideo()">🎥 Iniciar Câmera</button>
                    <button id="stopBtn" onclick="stopVideo()" disabled>⏹️ Parar</button>
                    <button id="resetBtn" onclick="resetRanking()">🔄 Resetar Ranking</button>
                </div>
                <div id="status" class="status">
                    ⏳ Carregando modelos...
                </div>
                <div id="errorDisplay" class="error-message" style="display: none;"></div>
            </div>

            <div class="ranking-section">
                <h2>🏆 Ranking de Emoções</h2>
                <div id="ranking" class="ranking-container">
                    <div class="loading">
                        <div class="loading-spinner"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="emotion-history">
            <div class="history-title">📊 Últimas emoções detectadas:</div>
            <div id="history" class="history-items"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <script>
        // Elementos DOM
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const statusEl = document.getElementById('status');
        const rankingEl = document.getElementById('ranking');
        const historyEl = document.getElementById('history');
        const errorDisplay = document.getElementById('errorDisplay');

        // Estado da aplicação
        let isRunning = false;
        let modelsLoaded = false;
        let detectionInterval = null;
        let emotionsHistory = [];
        const maxHistory = 10;
        let videoStream = null;

        // Dados do ranking
        const emotions = {
            neutral: { count: 0, emoji: '😐', color: '#808080' },
            happy: { count: 0, emoji: '😊', color: '#ffd700' },
            sad: { count: 0, emoji: '😢', color: '#4169e1' },
            angry: { count: 0, emoji: '😠', color: '#dc143c' },
            fearful: { count: 0, emoji: '😨', color: '#9370db' },
            disgusted: { count: 0, emoji: '🤢', color: '#32cd32' },
            surprised: { count: 0, emoji: '😲', color: '#ff8c00' }
        };

        let currentEmotions = {
            neutral: 0,
            happy: 0,
            sad: 0,
            angry: 0,
            fearful: 0,
            disgusted: 0,
            surprised: 0
        };

        // Mostrar erro
        function showError(message) {
            errorDisplay.textContent = message;
            errorDisplay.style.display = 'block';
            statusEl.textContent = '❌ Erro: ' + message;
        }

        // Limpar erro
        function clearError() {
            errorDisplay.style.display = 'none';
        }

        // Carregar modelos do Face-API
        async function loadModels() {
            statusEl.textContent = '📥 Carregando modelos...';
            rankingEl.innerHTML = '<div class="loading"><div class="loading-spinner"></div></div>';
            
            try {
                // Usando CDN alternativa para os modelos
                const modelUrl = 'https://justadudewhohacks.github.io/face-api.js/models';
                
                console.log('Carregando modelos...');
                await faceapi.nets.tinyFaceDetector.loadFromUri(modelUrl);
                console.log('TinyFaceDetector carregado');
                
                await faceapi.nets.faceExpressionNet.loadFromUri(modelUrl);
                console.log('FaceExpressionNet carregado');
                
                modelsLoaded = true;
                statusEl.innerHTML = '✅ Modelos carregados! <br> Clique em "Iniciar Câmera" para começar';
                clearError();
                
                // Mostrar ranking vazio
                updateRanking();
            } catch (error) {
                console.error('Erro detalhado ao carregar modelos:', error);
                showError('Erro ao carregar modelos. Verifique sua conexão com a internet.');
                statusEl.textContent = '❌ Erro ao carregar modelos. Tente recarregar a página.';
                rankingEl.innerHTML = '<p style="color: white; text-align: center; padding: 20px;">❌ Falha ao carregar modelos</p>';
            }
        }

        // Iniciar vídeo da câmera
        async function startVideo() {
            clearError();
            
            if (!modelsLoaded) {
                showError('Aguarde os modelos carregarem primeiro...');
                return;
            }

            try {
                statusEl.textContent = '📷 Solicitando acesso à câmera...';
                
                const constraints = {
                    video: {
                        width: { ideal: 640 },
                        height: { ideal: 480 },
                        facingMode: 'user',
                        frameRate: { ideal: 30 }
                    }
                };
                
                videoStream = await navigator.mediaDevices.getUserMedia(constraints);
                
                video.srcObject = videoStream;
                
                // Aguardar o vídeo começar a reproduzir
                await new Promise((resolve) => {
                    video.onloadedmetadata = () => {
                        video.play()
                            .then(resolve)
                            .catch(e => {
                                console.error('Erro ao dar play:', e);
                                resolve();
                            });
                    };
                });
                
                // Configurar canvas
                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 480;
                
                isRunning = true;
                startBtn.disabled = true;
                stopBtn.disabled = false;
                statusEl.innerHTML = '✅ Câmera ativa! <br> 🔍 Detectando emoções...';
                
                // Pequeno delay para garantir que o vídeo está rodando
                setTimeout(() => {
                    if (isRunning) {
                        startDetection();
                    }
                }, 500);
                
            } catch (error) {
                console.error('Erro detalhado ao acessar câmera:', error);
                
                let errorMessage = 'Erro ao acessar câmera. ';
                if (error.name === 'NotAllowedError') {
                    errorMessage += 'Permissão negada. Permita o acesso à câmera.';
                } else if (error.name === 'NotFoundError') {
                    errorMessage += 'Nenhuma câmera encontrada.';
                } else if (error.name === 'NotReadableError') {
                    errorMessage += 'Câmera está sendo usada por outro aplicativo.';
                } else {
                    errorMessage += 'Verifique se sua câmera está funcionando.';
                }
                
                showError(errorMessage);
                statusEl.textContent = '❌ ' + errorMessage;
                stopVideo();
            }
        }

        // Parar vídeo
        function stopVideo() {
            isRunning = false;
            
            if (videoStream) {
                videoStream.getTracks().forEach(track => {
                    track.stop();
                });
                videoStream = null;
            }
            
            if (video.srcObject) {
                video.srcObject = null;
            }
            
            startBtn.disabled = false;
            stopBtn.disabled = true;
            statusEl.textContent = '⏹️ Câmera parada';
            
            if (detectionInterval) {
                clearInterval(detectionInterval);
                detectionInterval = null;
            }
            
            clearCanvas();
        }

        // Limpar canvas
        function clearCanvas() {
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        // Iniciar detecção de emoções
        async function startDetection() {
            if (detectionInterval) {
                clearInterval(detectionInterval);
            }

            detectionInterval = setInterval(async () => {
                if (!isRunning || !modelsLoaded || !video.videoWidth) return;

                try {
                    // Detectar faces
                    const detections = await faceapi.detectAllFaces(
                        video, 
                        new faceapi.TinyFaceDetectorOptions({
                            inputSize: 224,
                            scoreThreshold: 0.5
                        })
                    ).withFaceExpressions();

                    // Desenhar no canvas
                    drawDetections(detections);

                    // Atualizar dados se houver detecções
                    if (detections && detections.length > 0) {
                        const expressions = detections[0].expressions;
                        updateEmotionData(expressions);
                        addToHistory(expressions);
                    } else {
                        resetCurrentEmotions();
                    }
                    
                    updateRanking();
                    
                } catch (error) {
                    console.error('Erro na detecção:', error);
                }
            }, 200); // Reduzido para 200ms para melhor performance
        }

        // Desenhar detecções no canvas
        function drawDetections(detections) {
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (detections && detections.length > 0) {
                // Ajustar tamanho do canvas se necessário
                if (canvas.width !== video.videoWidth || canvas.height !== video.videoHeight) {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                }

                const detection = detections[0];
                const box = detection.detection.box;
                
                // Desenhar retângulo ao redor do rosto
                ctx.strokeStyle = '#00ff00';
                ctx.lineWidth = 3;
                ctx.strokeRect(box.x, box.y, box.width, box.height);

                // Desenhar expressões
                const expressions = detection.expressions;
                let y = box.y - 10;
                
                // Ordenar por probabilidade
                const sortedExpressions = Object.entries(expressions)
                    .sort((a, b) => b[1] - a[1])
                    .slice(0, 3); // Mostrar apenas top 3
                
                ctx.font = 'bold 14px Arial';
                ctx.shadowColor = 'black';
                ctx.shadowBlur = 4;
                
                sortedExpressions.forEach(([emotion, probability]) => {
                    if (probability > 0.1) {
                        const percentage = (probability * 100).toFixed(1);
                        ctx.fillStyle = emotions[emotion]?.color || '#ffffff';
                        ctx.fillText(
                            `${emotions[emotion]?.emoji || '😶'} ${emotion}: ${percentage}%`, 
                            box.x, 
                            y
                        );
                        y -= 25;
                    }
                });
                
                ctx.shadowBlur = 0;
            }
        }

        // Atualizar dados das emoções
        function updateEmotionData(expressions) {
            currentEmotions = { ...expressions };
            
            // Encontrar emoção dominante (acima de 40% para contar)
            let maxEmotion = null;
            let maxValue = 0;
            
            Object.entries(expressions).forEach(([emotion, value]) => {
                if (value > maxValue) {
                    maxValue = value;
                    maxEmotion = emotion;
                }
            });

            if (maxEmotion && maxValue > 0.4) {
                emotions[maxEmotion].count++;
            }
        }

        // Resetar emoções atuais
        function resetCurrentEmotions() {
            Object.keys(currentEmotions).forEach(key => {
                currentEmotions[key] = 0;
            });
        }

        // Adicionar emoção ao histórico
        function addToHistory(expressions) {
            // Encontrar emoção dominante
            let maxEmotion = null;
            let maxValue = 0;
            
            Object.entries(expressions).forEach(([emotion, value]) => {
                if (value > maxValue) {
                    maxValue = value;
                    maxEmotion = emotion;
                }
            });

            if (maxEmotion && maxValue > 0.3) {
                emotionsHistory.unshift({
                    emotion: maxEmotion,
                    emoji: emotions[maxEmotion].emoji,
                    value: maxValue
                });

                if (emotionsHistory.length > maxHistory) {
                    emotionsHistory.pop();
                }
            }

            // Atualizar histórico visual
            updateHistory();
        }

        // Atualizar histórico visual
        function updateHistory() {
            if (emotionsHistory.length === 0) {
                historyEl.innerHTML = '<div class="history-item">Nenhuma emoção detectada ainda</div>';
                return;
            }
            
            historyEl.innerHTML = emotionsHistory.map(item => `
                <div class="history-item" style="background: ${emotions[item.emotion]?.color || '#808080'}80">
                    ${item.emoji} ${(item.value * 100).toFixed(0)}%
                </div>
            `).join('');
        }

        // Atualizar ranking
        function updateRanking() {
            const sortedEmotions = Object.entries(emotions)
                .sort((a, b) => b[1].count - a[1].count);

            const total = Object.values(emotions).reduce((sum, e) => sum + e.count, 0);

            if (total === 0) {
                rankingEl.innerHTML = '<p style="color: white; text-align: center; padding: 20px;">🎯 Nenhuma emoção detectada ainda<br><small>Olhe para a câmera e faça expressões!</small></p>';
                return;
            }

            const rankingHTML = sortedEmotions.map(([emotion, data]) => {
                const percentage = total > 0 ? (data.count / total * 100).toFixed(1) : 0;
                const currentProb = currentEmotions[emotion] || 0;
                const currentPercentage = (currentProb * 100).toFixed(1);

                return `
                    <div class="ranking-item">
                        <span class="emoji">${data.emoji}</span>
                        <div class="emotion-info">
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px;">
                                <span class="emotion-name">${emotion}</span>
                                <span class="count">${data.count}</span>
                            </div>
                            <div style="display: flex; align-items: center; gap: 10px;">
                                <div class="progress-bar" style="flex: 1;">
                                    <div class="progress-fill" style="width: ${percentage}%"></div>
                                </div>
                                <span class="percentage">${percentage}%</span>
                            </div>
                            ${currentProb > 0.1 ? `
                                <div style="font-size: 12px; margin-top: 5px; color: #ffd700;">
                                    Agora: ${currentPercentage}%
                                </div>
                            ` : ''}
                        </div>
                    </div>
                `;
            }).join('');

            rankingEl.innerHTML = rankingHTML;
        }

        // Resetar ranking
        function resetRanking() {
            Object.keys(emotions).forEach(key => {
                emotions[key].count = 0;
            });
            
            emotionsHistory = [];
            resetCurrentEmotions();
            updateHistory();
            updateRanking();
            statusEl.innerHTML = '📊 Ranking resetado!<br> Continue fazendo expressões!';
        }

        // Iniciar carregamento dos modelos quando a página carregar
        window.addEventListener('load', () => {
            loadModels();
        });

        // Limpar ao fechar
        window.addEventListener('beforeunload', () => {
            if (isRunning) {
                stopVideo();
            }
        });
    </script>
</body>
</html>
